name: Actualizar TRMI

on:
  schedule:
    - cron: "0 * * * *"   # Ejecuta cada hora en el minuto 0 (UTC)
  workflow_dispatch:       # Permite ejecutarlo manualmente desde la UI

jobs:
  update-trmi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Consultar TRMI desde elTOQUE
        run: |
          set -e
          echo "Consultando API elTOQUE..."
          curl -s -H "Authorization: Bearer ${{ secrets.ELTOQUE_KEY }}" \
            https://tasas.eltoque.com/api/trmi \
            -o data.json
          echo "Contenido descargado:"
          cat data.json

      - name: Commit y push de data.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Actualizar TRMI" || echo "Sin cambios"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
