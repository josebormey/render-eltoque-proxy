<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TRMI elTOQUE (mirror)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; overflow: auto; }
    .meta { color: #555; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>TRMI elTOQUE (mirror)</h1>
  <div class="meta">
    Fuente: API elTOQUE (consultada por GitHub Actions).<br>
    Archivo: <code>data.json</code> — se actualiza cada hora (UTC).
  </div>
  <pre id="json">Cargando...</pre>

  <script>
    fetch("../data.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("json").textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("json").textContent = "Error cargando data.json: " + err;
      });
  </script>
</body>
</html>
